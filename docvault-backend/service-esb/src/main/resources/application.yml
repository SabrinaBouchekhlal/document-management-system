server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: docvault-esb

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:docvault}
    username: ${POSTGRES_USER:docvault}
    password: ${POSTGRES_PASSWORD:docvault123}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: esb-audit-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.docvault.shared.events"
        spring.json.use.type.headers: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,prometheus 
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: DocVault ESB Service
    version: 1.0.0

logging:
  level:
    com.docvault: DEBUG
    org.springframework.kafka: INFO
