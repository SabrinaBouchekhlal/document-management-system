apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docvault-ingress
  namespace: docvault
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  rules:
    - host: docvault.local
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080

          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080