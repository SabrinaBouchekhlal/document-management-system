# ─────────────────────────────────────────────────────────────
# AI CONSUMER
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-consumer
  namespace: docvault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-consumer
  template:
    metadata:
      labels:
        app: ai-consumer
    spec:
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command: ["sh","-c","until nc -z redpanda 9092; do sleep 2; done"]
      containers:
        - name: ai-consumer
          image: docvault/ai-consumer:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: docvault-config
            - secretRef:
                name: docvault-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"