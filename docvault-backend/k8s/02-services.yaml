  replicas: 2
  selector:
    matchLabels:
      app: comments
  template:
    metadata:
      labels:
        app: comments
    spec:
      initContainers:
        - name: wait-cassandra
          image: busybox:1.36
          command: ["sh","-c","until nc -z cassandra 9042; do sleep 3; done"]
        - name: wait-kafka
          image: busybox:1.36
          command: ["sh","-c","until nc -z redpanda 9092; do sleep 2; done"]
      containers:
        - name: comments
          image: docvault/comments:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: docvault-config
            - secretRef:
                name: docvault-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 70
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: comments
  namespace: docvault
spec:
  selector:
    app: comments
  ports:
    - port: 8082
      targetPort: 8082

