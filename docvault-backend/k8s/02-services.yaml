# ─────────────────────────────────────────────────────────────
# GATEWAY
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: docvault
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: docvault/gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: docvault-config
            - secretRef:
                name: docvault-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: docvault
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080

---
# ─────────────────────────────────────────────────────────────
# DOCUMENTS
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: documents
  namespace: docvault
spec:
  replicas: 2
  selector:
    matchLabels:
      app: documents
  template:
    metadata:
      labels:
        app: documents
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh","-c","until nc -z postgres-primary 5432; do sleep 2; done"]
        - name: wait-kafka
          image: busybox:1.36
          command: ["sh","-c","until nc -z redpanda 9092; do sleep 2; done"]
        - name: wait-s3
          image: busybox:1.36
          command: ["sh","-c","until nc -z localstack 4566; do sleep 2; done"]
      containers:
        - name: documents
          image: docvault/documents:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: docvault-config
            - secretRef:
                name: docvault-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "600m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 70
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 50
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: documents
  namespace: docvault
spec:
  selector:
    app: documents
  ports:
    - port: 8081
      targetPort: 8081

